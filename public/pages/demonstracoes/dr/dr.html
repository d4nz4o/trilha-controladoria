<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilha Participações | Demonstração de Resultado</title>
  <link rel="icon" type="image/png" href="../../../assets/icons/favicon-trilha.png">
  <link rel="stylesheet" href="../commons.css">
  <link rel="stylesheet" href="dr.css">
  <!-- Sessão (login, domínio corporativo e ociosidade) + fonte de dados. Ver /src/scripts/core e /src/scripts/services -->
  <script src="../../../src/scripts/core/sessao.js"></script>
  <script src="../../../src/scripts/services/fonte-dados.js"></script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="../../../src/scripts/core/supabase.js"></script>
  <script defer src="../../../src/scripts/core/dados.js"></script>
  <script defer src="../../../src/scripts/core/usuario.js"></script>
  <script defer src="../../../src/scripts/core/inatividade.js"></script>
  <script defer src="../../../src/scripts/core/main.js"></script>
</head>
<body>

  <!-- Barra superior: logo + navegação -->
  <header class="barra-topo">
    <div class="barra-topo-inner">
      <a class="marca-logo" href="../../hub/hub.html" aria-label="Trilha Participações, início">
        <img src="../../../assets/images/logo-trilha.png" alt="Trilha Participações" width="182" height="68">
      </a>
      <nav class="abas" aria-label="Demonstrações">
        <a href="../../hub/hub.html">Início</a>
        <a href="../bp/bp.html">BP</a>
        <a aria-current="page">DR</a>
        <a href="../dmpl/dmpl.html">DMPL</a>
        <a href="../dfc/dfc.html">DFC</a>
      </nav>
    </div>
  </header>

  <main class="app">

    <!-- Cabeçalho -->
    <header class="topbar">
      <div class="bp-title-group">
        <h1>Demonstração do Resultado</h1>
        <p>Valores expressos em milhares de reais (R$ mil).</p>
      </div>

      <div class="bp-actions">
        <div class="seg" role="group" aria-label="Tipo de valor">
          <button type="button" class="seg-btn is-active" data-visao="mensal" aria-pressed="true" onclick="definirVisao('mensal')">Mensal</button>
          <button type="button" class="seg-btn" data-visao="acumulado" aria-pressed="false" onclick="definirVisao('acumulado')">Acumulado</button>
        </div>

        <div class="periodo" id="grupoEmpresa">
          <div class="filter-group highlight-mom">
            <label for="selectEmpresa">Empresa:</label>
            <select id="selectEmpresa" onchange="alterarEmpresa()"></select>
          </div>
        </div>

        <div class="periodo" role="group" aria-labelledby="rotuloVisao">
          <div class="filter-group">
            <span class="filter-label" id="rotuloVisao">Visão:</span>
            <div class="seg">
              <button type="button" class="seg-btn is-active" data-modo="empresa" aria-pressed="true" onclick="definirModoVisao('empresa')">Por empresa</button>
              <button type="button" class="seg-btn" data-modo="consolidada" data-todas-empresas aria-pressed="false" onclick="definirModoVisao('consolidada')">Consolidada</button>
            </div>
          </div>
        </div>

        <div class="periodo" role="group" aria-label="Período">
          <div class="filter-group highlight-mom">
            <label for="selectMesRef">Mês selecionado:</label>
            <button type="button" class="btn-mes" id="btnMesAnterior" onclick="navegarMes(-1)" title="Mês anterior" aria-label="Mês anterior">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5L5.5 8l4.5 4.5"/></svg>
            </button>
            <select id="selectMesRef" onchange="alterarPeriodos()"></select>
            <button type="button" class="btn-mes" id="btnMesProximo" onclick="navegarMes(1)" title="Próximo mês" aria-label="Próximo mês">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5"/></svg>
            </button>
          </div>
        </div>

        <div class="periodo">
          <div class="filter-group">
            <button type="button" class="btn-filtro" id="btnOcultarZerados" aria-pressed="false" onclick="alternarOcultarZerados()"
                    title="Esconde as linhas em que todos os valores exibidos são zero">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8s2.2-4 6-4 6 4 6 4-2.2 4-6 4-6-4-6-4z"/><path d="M3 13L13 3"/></svg>
              Ocultar sem saldo
            </button>
          </div>
        </div>

        <div class="acoes">
          <button type="button" class="btn-action btn-exportar" onclick="exportarExcel()" title="Baixa a visão atual em uma planilha do Excel">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5v7M5 6.5l3 3 3-3M3 11.5v2h10v-2"/></svg>
            Exportar planilha
          </button>

          <button type="button" class="btn-action" onclick="alternarTodos(true)">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5l4 4 4-4"/></svg>
            Expandir
          </button>
          
          <button type="button" class="btn-action" onclick="alternarTodos(false)">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 9.5l4-4 4 4"/></svg>
            Recolher
          </button>
        </div>
      </div>
    </header>

    <!-- Tabela com duplo cabeçalho -->
    <section class="bp-card-container">
      <p class="bp-aviso" id="avisoDados" hidden></p>
      <p class="bp-aviso" id="avisoPeriodo" hidden></p>
      <div class="bp-corpo">
        <div class="bp-table-wrapper">
          <table class="bp-table" id="tabelaDR">
            <thead id="theadDR"></thead>
            <tbody id="tbodyDR"></tbody>
          </table>
        </div>
        <!-- Indicadores (só na visão por empresa): ../indicadores.js -->
        <aside class="painel-indicadores" id="painelIndicadores" aria-label="Indicadores" hidden></aside>
      </div>
      <p class="bp-legenda" id="legendaDR"></p>
    </section>
  </main>

  <!-- Modal de revisão analítica -->
  <!-- Modal de revisão analítica no estilo WhatsApp -->
  <div id="modalComentario" class="modal-overlay" onclick="fecharModal(event)">
    <div class="modal-card modal-chat" role="dialog" aria-modal="true" aria-labelledby="modalTitulo" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div class="modal-header-info">
          <h3 id="modalTitulo">Revisão analítica</h3>
          <p class="modal-subtitle" id="modalSubtitulo"></p>
        </div>
        <button type="button" class="btn-close-modal" onclick="fecharModal()" aria-label="Fechar">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>

      <!-- Área onde aparecem os comentários (Histórico de Balões) -->
      <div class="modal-body chat-body" id="chatHistorico">
        <!-- Os balões serão inseridos dinamicamente aqui -->
      </div>

      <!-- Caixa de envio (Adicionar comentário) -->
      <div class="modal-footer chat-footer" data-editar="demonstracoes">
        <div class="chat-input-row">
          <textarea id="txtComentario" placeholder="Escreva um comentário…" rows="4" aria-label="Comentário"></textarea>
          <button type="button" class="btn-save btn-chat-send" onclick="salvarComentario()" title="Enviar comentário (Ctrl + Enter)">
            <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
              <path d="M1.5 1.5l13 6.5-13 6.5v-5l7-1.5-7-1.5z"/>
            </svg>
          </button>
        </div>
        <span class="modal-dica">Pressione Ctrl + Enter para enviar</span>
        <span class="chat-feedback" id="feedbackComentario" role="status" aria-live="polite"></span>
      </div>
    </div>
  </div>

  <script src="../commons.js"></script>
  <script src="../indicadores.js"></script>
  <script src="../exportar.js"></script>
  <script src="dr.js"></script>
</body>
</html>
