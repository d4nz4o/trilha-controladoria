<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Trilha Participações | Equipe</title>
        <link rel="icon" type="image/png" href="../../../assets/icons/favicon-trilha.png">
        <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
        <link rel="stylesheet" href="../commons/tokens.css">
        <link rel="stylesheet" href="../commons/base.css">
        <link rel="stylesheet" href="../commons/topbar.css">
        <link rel="stylesheet" href="../commons/layout.css">
        <link rel="stylesheet" href="../commons/components.css">
        <link rel="stylesheet" href="equipe.css">

        <!-- Esconde a página até o login ser confirmado (main.js) -->
        <script src="../../../src/scripts/core/sessao.js"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script defer src="../../../src/scripts/core/supabase.js"></script>
        <script defer src="../commons/state.js"></script>
        <script defer src="../commons/utils.js"></script>
        <script defer src="../commons/avatar.js"></script>
        <script defer src="../../../src/scripts/core/dados.js"></script>
        <script defer src="../../../src/scripts/core/usuario.js"></script>
        <script defer src="equipe.js"></script>
        <script defer src="../commons/layout.js"></script>
        <script defer src="../commons/busca.js"></script>
        <script defer src="../../../src/scripts/core/inatividade.js"></script>
        <script defer src="../../../src/scripts/core/main.js"></script>
    </head>

    <body data-aba="equipe">
        <!-- A barra superior é montada por commons/layout.js -->
        <header class="barra-topo" id="topbar"></header>

        <main class="content-container">
            <section id="view-equipe" class="view-section active">
                <div class="main-container">
                    <!-- Sidebar Equipe -->
                    <aside class="sidebar">
                        <h2>Equipe</h2>
                        <label class="filtro-inativos">
                            <input type="checkbox" id="mostrarInativos" onchange="renderizarEquipeFiltrada()">
                            Mostrar inativos
                        </label>
                        <div class="team-list" id="teamListEquipe">
                            <small style="color:var(--text-muted);">Carregando…</small>
                        </div>
                    </aside>

                    <!-- Painel de Detalhes do Colaborador -->
                    <div class="details-panel" id="colabDetailsPanel">
                        <div class="details-placeholder">
                            <div class="placeholder-icon">🙋🏽‍♀️</div>
                            <h3>Selecione um(a) colaborador(a)</h3>
                            <p>Clique em um(a) colaborador(a) na barra lateral para visualizar suas informações.</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <script>function iniciarPagina() { carregarColaboradores(); }</script>
    </body>
</html>
