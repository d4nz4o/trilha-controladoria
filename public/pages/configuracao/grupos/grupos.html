<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilha Participações | Configurações · Grupos de acesso</title>
  <link rel="icon" type="image/png" href="../../../assets/icons/favicon-trilha.png">
  <link rel="stylesheet" href="../../../src/styles/cores.css">   <!-- paleta única de cores -->
  <link rel="stylesheet" href="../../demonstracoes/commons.css">
  <link rel="stylesheet" href="../commons.css">
  <link rel="stylesheet" href="grupos.css">
  <!-- Sessão (login, domínio corporativo e ociosidade). Ver /src/scripts/core -->
  <script src="../../../src/scripts/core/sessao.js"></script>
  <script src="../../../src/scripts/services/fonte-dados.js"></script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="../../../src/scripts/core/supabase.js"></script>
  <script defer src="../../../src/scripts/core/dados.js"></script>
  <script defer src="../../../src/scripts/core/usuario.js"></script>
  <script defer src="../../../src/scripts/core/inatividade.js"></script>
  <script defer src="../../../src/scripts/core/main.js"></script>
</head>
<body data-pagina-config="grupos">

  <!-- Barra superior: logo + abas de Configurações (montadas por ../commons.js; o avatar vem de usuario.js) -->
  <header class="barra-topo">
    <div class="barra-topo-inner">
      <a class="marca-logo" href="../../hub/hub.html" aria-label="Trilha Participações, início">
        <img src="../../../assets/images/logo-trilha.png" alt="Trilha Participações" width="182" height="68">
      </a>
      <nav class="abas" id="abasConfig" aria-label="Configurações"></nav>
    </div>
  </header>

  <main class="app">
   <!-- Seção: grupos de acesso (grupos.js) -->
   <div class="cad-secao" data-secao="grupos">
    <header class="topbar">
      <div class="bp-title-group">
        <h1>Configurações</h1>
        <p>Grupos de acesso: o nível de cada grupo em cada parte do portal (Nenhum, Leitura ou Edição).</p>
      </div>
      <div class="cad-filtros">
        <button type="button" class="btn-action btn-novo-colab" data-editar="grupos_acesso" onclick="abrirGrupo(null)">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
          Grupo
        </button>
      </div>
    </header>

    <section class="bp-card-container">
      <div class="cad-tabela-area">
        <table class="cad-tabela">
          <thead><tr><th>Grupo</th><th>Descrição</th><th>Permissões</th><th class="num">Pessoas</th></tr></thead>
          <tbody id="gruCorpo"><tr><td colspan="4" class="cad-vazio">Carregando…</td></tr></tbody>
        </table>
      </div>
      <p class="cad-rodape" id="gruRodape"></p>
    </section>
   </div>
  </main>

  <!-- Formulário de grupos de acesso -->
  <div class="modal-overlay" id="modalGrupo">
    <div class="modal-card modal-chat modal-cadastro modal-grupo" role="dialog" aria-modal="true" aria-labelledby="gruTitulo">
      <header class="modal-header">
        <div class="modal-header-info"><h3 id="gruTitulo">Grupo de acesso</h3></div>
        <button type="button" class="btn-close-modal" aria-label="Fechar" onclick="fecharGrupo()">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </header>
      <form class="cad-form" id="gruForm" onsubmit="event.preventDefault(); salvarGrupo();" novalidate>
        <fieldset>
          <legend>Grupo</legend>
          <div class="cad-grade">
            <label>Nome *<input type="text" name="nome_grupo" maxlength="60" placeholder="ex.: Diretoria"></label>
            <label>Descrição<input type="text" name="desc_grupo" maxlength="160" placeholder="Para quem é este grupo"></label>
          </div>
          <p class="cad-login" id="gruPessoas"></p>
        </fieldset>
        <fieldset>
          <legend>Permissões</legend>
          <div id="gruGrade"></div>
        </fieldset>
      </form>
      <footer class="exportar-acoes cad-acoes">
        <button type="button" class="btn-action gru-excluir" id="gruExcluir" data-editar="grupos_acesso" onclick="excluirGrupo()">Excluir grupo</button>
        <span class="cad-feedback" id="gruFeedback" role="status"></span>
        <button type="button" class="btn-action" onclick="fecharGrupo()">Cancelar</button>
        <button type="submit" form="gruForm" class="btn-exportar-confirmar" id="gruSalvar" data-editar="grupos_acesso">Salvar</button>
      </footer>
    </div>
  </div>

  <script src="../commons.js"></script>
  <script src="grupos.js"></script>
</body>
</html>
