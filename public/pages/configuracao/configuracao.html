<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="../../assets/icons/favicon-trilha.png">
  <link rel="stylesheet" href="../../src/styles/cores.css">   <!-- paleta única de cores -->
  <link rel="stylesheet" href="../demonstracoes/commons.css">
    <!-- Sessão (login, domínio corporativo e ociosidade). Ver /src/scripts/core -->

  <script src="../../src/scripts/services/fonte-dados.js"></script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body>
  <!-- Configurações: abre a primeira página que o grupo de acesso permite ver.
       Links antigos (configuracao.html#empresas, #contas…) vão para a página correspondente. -->
  <main class="app"><p class="cad-redirecionando" style="margin: 48px auto; text-align: center; color: var(--ink-3)">Abrindo Configurações…</p></main>
  <script src="commons.js"></script>
  <script>
    const ANTIGOS = { colaboradores: 'colaboradores', empresas: 'empresas', contas: 'plano-contas', balancetes: 'balancetes', grupos: 'grupos' };
    function iniciarConfig() {
      const pedida = ANTIGOS[location.hash.slice(1)];
      const permitidas = PAGINAS_CONFIG.filter(p => Permissoes.podeVer(p.recurso)).map(p => p.id);
      const destino = permitidas.includes(pedida) ? pedida : permitidas[0];
      location.replace(destino ? `${destino}/${destino}.html` : '../hub/hub.html');
    }
  </script>
</body>
</html>
