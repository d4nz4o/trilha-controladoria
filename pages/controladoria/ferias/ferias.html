<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Trilha Participações | Férias</title>
        <link rel="icon" type="image/png" href="../../../assets/icons/favicon-trilha.png">
        <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
        <link rel="stylesheet" href="../commons/tokens.css">
        <link rel="stylesheet" href="../commons/base.css">
        <link rel="stylesheet" href="../commons/topbar.css">
        <link rel="stylesheet" href="../commons/layout.css">
        <link rel="stylesheet" href="../commons/components.css">
        <link rel="stylesheet" href="../commons/popup.css">
        <link rel="stylesheet" href="ferias.css">

        <!-- Esconde a página até o login ser confirmado (main.js) -->
        <script src="../../../src/scripts/core/sessao.js"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script defer src="../../../src/scripts/core/supabase.js"></script>
        <script defer src="../commons/state.js"></script>
        <script defer src="../commons/utils.js"></script>
        <script defer src="../commons/avatar.js"></script>
        <script defer src="../../../src/scripts/core/dados.js"></script>
        <script defer src="../../../src/scripts/core/usuario.js"></script>
        <script defer src="ferias.js"></script>
        <script defer src="nova-ferias.js"></script>
        <script defer src="../commons/layout.js"></script>
        <script defer src="../commons/busca.js"></script>
        <script defer src="../../../src/scripts/core/inatividade.js"></script>
        <script defer src="../../../src/scripts/core/main.js"></script>
    </head>

    <body data-aba="ferias">
        <!-- A barra superior é montada por commons/layout.js -->
        <header class="barra-topo" id="topbar"></header>

        <main class="content-container">
            <section id="view-ferias" class="view-section active">
                <div class="view-container">
                    <div class="ferias-header-controls">
                        <h2>Cronograma de Férias e Day Off</h2>
                        <div class="ano-selector">
                            <button type="button" class="btn-ano" id="btn-ano-anterior" onclick="mudarAnoFerias(-1)">&lt;</button>
                            <span id="anoFeriasAtual">2026</span>
                            <button type="button" class="btn-ano" id="btn-ano-proximo" onclick="mudarAnoFerias(1)">&gt;</button>
                        </div>
                    </div>
                    <div id="legendaFerias" class="legenda-ferias"></div>
                    <div id="mapaFeriasGrid" class="mapa-ferias-grid"></div>
                </div>
            </section>
        </main>

        <!-- MODAL DE NOVAS FÉRIAS (botão "+ Férias" da barra superior) -->
        <div class="modal-overlay" id="modalNovasFerias" onclick="fecharModalNovasFerias(event)">
            <form class="modal-card-container novas-ferias" id="formNovasFerias" onclick="event.stopPropagation()"
                  onsubmit="salvarNovasFerias(event)" novalidate
                  role="dialog" aria-modal="true" aria-labelledby="novasFeriasTitulo">
                <button type="button" class="modal-close-btn" onclick="fecharModalNovasFerias()" aria-label="Fechar">&times;</button>
                <div class="modal-header">
                    <span class="modal-coluna-badge">Férias e day off</span>
                    <h2 id="novasFeriasTitulo">Registrar período</h2>
                </div>

                <div class="popup-campo">
                    <label for="nfColaborador">Colaborador(a) <span class="popup-obrigatorio" aria-hidden="true">*</span></label>
                    <select id="nfColaborador" required onchange="atualizarResumoNovasFerias()">
                        <option value="">Carregando equipe…</option>
                    </select>
                </div>

                <div class="nf-tipo" role="radiogroup" aria-label="Tipo de período">
                    <label class="nf-tipo-opcao"><input type="radio" name="nfTipo" value="ferias" checked onchange="tipoNovasFeriasAlterado()"> Férias</label>
                    <label class="nf-tipo-opcao"><input type="radio" name="nfTipo" value="dayoff" onchange="tipoNovasFeriasAlterado()"> Day off (1 dia)</label>
                </div>

                <div class="nf-datas">
                    <div class="popup-campo">
                        <label for="nfInicio">Início <span class="popup-obrigatorio" aria-hidden="true">*</span></label>
                        <input type="date" id="nfInicio" required onchange="dataNovasFeriasAlterada('inicio')">
                    </div>
                    <div class="popup-campo" id="nfCampoFim">
                        <label for="nfFim">Fim <span class="popup-obrigatorio" aria-hidden="true">*</span></label>
                        <input type="date" id="nfFim" required onchange="dataNovasFeriasAlterada('fim')">
                    </div>
                </div>

                <!-- Duração e sobreposições com outros períodos -->
                <div class="nf-resumo" id="nfResumo" aria-live="polite"></div>

                <div class="popup-rodape">
                    <span class="popup-feedback" id="nfFeedback" role="status" aria-live="polite"></span>
                    <button type="button" class="btn-secondary" onclick="fecharModalNovasFerias()">Cancelar</button>
                    <button type="submit" class="btn-primary" id="nfSalvar">Registrar</button>
                </div>
            </form>
        </div>

        <script>function iniciarPagina() { carregarFerias(); }</script>
    </body>
</html>
