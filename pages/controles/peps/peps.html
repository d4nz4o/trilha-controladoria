<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trilha Participações | Controle de ativos</title>
  <link rel="icon" type="image/png" href="../../../assets/icons/favicon-trilha.png">
  <link rel="stylesheet" href="../commons.css">
  <link rel="stylesheet" href="peps.css">
  <!-- Sessão (login, domínio corporativo e ociosidade) + fonte de dados. Ver /src/scripts/core e /src/scripts/services -->
  <script src="../../../src/scripts/core/sessao.js"></script>
  <script src="../../../src/scripts/services/fonte-dados.js"></script>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="../../../src/scripts/core/supabase.js"></script>
  <script defer src="../../../src/scripts/core/dados.js"></script>
  <script defer src="../../../src/scripts/core/usuario.js"></script>
  <script defer src="../../../src/scripts/core/inatividade.js"></script>
  <script defer src="../../../src/scripts/core/main.js"></script>
</head>
<body>
  <header class="barra-topo">
    <div class="barra-topo-inner">
      <a class="marca-logo" href="../../hub/hub.html" aria-label="Trilha Participações, início">
        <img src="../../../assets/images/logo-trilha.png" alt="Trilha Participações" width="182" height="68">
      </a>
      <nav class="abas" aria-label="Controle de ativos">
        <a href="../../hub/hub.html">Início</a>
        <a href="../composicao/composicao.html">Composição geral</a>
        <a href="../analitico/analitico.html">Analítico</a>
        <a aria-current="page">PEPs</a>
        <a href="../ordens/ordens_inv.html">Ordens de investimento</a>
      </nav>
    </div>
  </header>

  <main class="app">
    <div class="topbar">
      <div class="bp-title-group">
        <h1>Controle de Ativos</h1>
        <p>Data-base: setembro/2026.</p>
      </div>
      <div class="bp-actions">
        <div class="periodo"><div class="filter-group"><label for="pq">Busca:</label><input id="pq" type="search" placeholder="Código ou descrição do PEP"></div></div>
        <div class="periodo"><div class="filter-group highlight-mom"><label for="pnat">Natureza:</label><select id="pnat"><option value="">Todas</option><option value="A">Aportes</option><option value="P">Próprias</option><option value="R">Reversíveis</option></select></div></div>
        <div class="acoes">
          <button type="button" class="btn-action" id="pex"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6.5l4 4 4-4"/></svg> Expandir</button>
          <button type="button" class="btn-action" id="prc"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 9.5l4-4 4 4"/></svg> Recolher</button>
        </div>
      </div>
    </div>

    <div class="kpis" id="kpis"></div>

    <section class="bp-card-container">
      <div class="bp-table-wrapper"><table class="bp-table tb-ativos"><caption class="sr-only">Estrutura de PEPs</caption><thead><tr><th>Descrição</th><th>Código PEP</th><th>Nível</th><th>Natureza</th><th>Início base</th><th>Fim base</th><th class="n">PEPs abaixo</th></tr></thead><tbody id="pt"></tbody></table></div>
      <p class="bp-legenda" id="pnota"></p>
    </section>
  </main>

  <dialog id="dg"></dialog>
  <script type="module" src="../commons.js"></script>
  <script type="module" src="peps.js"></script>
</body>
</html>
